<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Giáo viên · Bảng điều khiển</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrite, so refreshing a client-side
      // route (e.g. /hocvoihanh/teacher/homework) 404s. This redirects that
      // 404 back to index.html with the intended path encoded in the query
      // string; index.html then restores it via history.replaceState.
      // pathSegmentsToKeep = 1 keeps the repo name segment ("/hocvoihanh").
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
